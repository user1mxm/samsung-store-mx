name: Storefront fixes validation
on:
  pull_request:
  push:
    branches: [fix/storefront-checkout-stock-20261007]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_DATABASE: samsung_store_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --test tests/cart-safety.test.mjs tests/payment-contracts.test.mjs tests/reconciliation.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/route-contracts.test.mjs
      - run: node --test tests/deploy-recovery.test.mjs
      - run: node --test tests/commerce.test.mjs
      - run: bash -n scripts/deploy-vps.sh
      - run: node --test tests/orders-mysql.test.mjs
        env:
          MYSQL_TEST_URL: mysql://root:fixture-password@127.0.0.1:3306/samsung_store_test
      - run: npm run build
      - run: npm run check
      - run: node --test tests/tv-model.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/storefront-browser.mjs
      - run: node tests/admin-auth-mysql.mjs
        env:
          MYSQL_TEST_URL: mysql://root:fixture-password@127.0.0.1:3306/samsung_store_test
      - run: node --test tests/commerce-mysql.test.mjs
        env:
          MYSQL_TEST_URL: mysql://root:fixture-password@127.0.0.1:3306/samsung_store_test
      - run: node tests/production-smoke.mjs
